<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Caja Diario · Movimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --bg2:#0f151d; --panel:#121a24; --panel2:#16202c;
  --line:#21303f; --line2:#2c4055;
  --ink:#e7eef6; --ink2:#9fb2c6; --ink3:#647a91;
  --gold:#d4a64a; --gold2:#f0c878;
  --green:#3fd98a; --green-dim:#1d3a2e; --green-bg:rgba(63,217,138,.10);
  --red:#ff6b6b; --red-dim:#3a1d22; --red-bg:rgba(255,107,107,.10);
  --blue:#5aa9ff;
  --shadow:0 18px 50px -16px rgba(0,0,0,.7);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 88% -8%,rgba(212,166,74,.10),transparent 60%),
    radial-gradient(700px 500px at -5% 12%,rgba(90,169,255,.07),transparent 55%),
    var(--bg);
  color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  letter-spacing:.1px;
}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a5269}

/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-right:1px solid var(--line);
  padding:26px 18px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;z-index:30;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;padding:0 6px}
.brand .mark{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--gold),#9c6f1f);
  display:grid;place-items:center;font-size:22px;
  box-shadow:0 6px 18px -6px rgba(212,166,74,.6);
}
.brand h1{font-family:'Fraunces';font-size:18px;font-weight:600;line-height:1.05}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:1.4px;text-transform:uppercase}
.nav-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink3);margin:18px 8px 6px}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:none;color:var(--ink2);font-family:inherit;font-size:14px;
  padding:11px 12px;border-radius:10px;cursor:pointer;transition:.18s;font-weight:500;
}
.nav-btn .ic{width:18px;text-align:center;font-size:15px;opacity:.85}
.nav-btn:hover{background:var(--panel);color:var(--ink)}
.nav-btn.on{background:linear-gradient(90deg,rgba(212,166,74,.16),rgba(212,166,74,.02));color:var(--gold2);box-shadow:inset 2px 0 0 var(--gold)}
.side-foot{margin-top:auto;font-size:11px;color:var(--ink3);padding:12px 8px;border-top:1px solid var(--line)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
  background:rgba(11,15,20,.78);border-bottom:1px solid var(--line);
  padding:16px 34px;display:flex;align-items:center;gap:22px;flex-wrap:wrap
}
.topbar h2{font-family:'Fraunces';font-weight:600;font-size:21px}
.topbar .sub{font-size:12px;color:var(--ink3)}
.ticker{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column}
.tk b{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tk .v{font-size:15px;font-weight:600}
.tk .v.g{color:var(--green)} .tk .v.r{color:var(--red)} .tk .v.go{color:var(--gold2)}
.wrap{padding:30px 34px 70px;max-width:1320px;width:100%}
.view{display:none;animation:fade .4s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* kpi cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.kpi{
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;
}
.kpi::after{content:'';position:absolute;inset:0 0 auto auto;width:120px;height:120px;
  background:radial-gradient(circle at top right,rgba(212,166,74,.10),transparent 70%);pointer-events:none}
.kpi .lab{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .num{font-size:25px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
.kpi .meta{font-size:12px;color:var(--ink2);margin-top:5px}
.kpi.acc{border-color:rgba(212,166,74,.4)}
.kpi.acc .num{color:var(--gold2)}
.pos{color:var(--green)} .neg{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.chip.up{background:var(--green-bg);color:var(--green)} .chip.down{background:var(--red-bg);color:var(--red)}

/* panels */
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px}
.grid2.rev{grid-template-columns:1fr 1.55fr}
.panel{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.panel h3{font-family:'Fraunces';font-size:16px;font-weight:600;margin-bottom:3px}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.panel .ph p{font-size:12px;color:var(--ink3)}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;transition:.15s}
.seg button.on{background:var(--gold);color:#1a1206}

/* chart */
.chart-svg{width:100%;display:block;overflow:visible}
.chart-svg text{font-family:'JetBrains Mono',monospace;fill:var(--ink3)}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.tip{position:fixed;pointer-events:none;background:#060a0f;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;font-size:12px;z-index:200;opacity:0;transition:opacity .12s;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:240px}
.tip b{font-family:'Fraunces';font-size:13px;display:block;margin-bottom:4px}
.tip .ln{display:flex;justify-content:space-between;gap:18px;color:var(--ink2)}
.tip .ln span:last-child{color:var(--ink);font-family:'JetBrains Mono'}

/* month index */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 12px 9px 36px;font-family:inherit;font-size:14px;transition:.15s}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,166,74,.2)}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.mono-label{font-family:'JetBrains Mono';font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.btn{background:none;border:none;color:var(--ink2);cursor:pointer;font-family:inherit;font-size:14px;padding:8px 12px;border-radius:8px;transition:.15s}
.btn:hover{background:var(--panel);color:var(--ink)}
.btn-primary{background:var(--gold);color:#1a1206;font-weight:600}
.btn-primary:hover{background:var(--gold2)}
.btn-ghost{color:var(--ink2)}
.btn-ghost:hover{color:var(--ink)}
.btn-del{color:var(--red)}
.btn-del:hover{background:var(--red-bg)}

/* month view */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.month-card{background:linear-gradient(160deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;box-shadow:var(--shadow)}
.month-card-h{background:linear-gradient(90deg,rgba(212,166,74,.15),rgba(90,169,255,.10));padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.month-card-h h4{font-family:'Fraunces';font-size:15px;font-weight:600}
.month-card-h button{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:18px;transition:.15s;padding:0;width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.month-card-h button:hover{background:var(--line);color:var(--ink)}
.month-days{display:flex;flex-direction:column;max-height:400px;overflow-y:auto}
.day-item{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer;transition:.15s}
.day-item:hover{background:var(--panel)}
.day-item.empty{opacity:.5}
.day-date{min-width:60px}
.day-date-num{font-weight:700;font-size:15px;font-family:'JetBrains Mono'}
.day-date-wd{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.day-fig{flex:1;display:flex;gap:14px;justify-content:flex-end}
.day-fig-item{text-align:right}
.day-fig-item b{font-size:11px;color:var(--ink3);text-transform:uppercase;font-weight:600;letter-spacing:.8px;display:block}
.day-fig-item span{font-family:'JetBrains Mono';font-size:13px;font-weight:600;display:block;margin-top:2px}
.day-fig-item .pos{color:var(--green)} .day-fig-item .neg{color:var(--red)}
.day-item.has-dif .day-fig-item:last-child{background:rgba(255,107,107,.08);padding:2px 8px;border-radius:6px;border:1px solid rgba(255,107,107,.3)}

/* day modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;visibility:hidden;transition:.2s;backdrop-filter:blur(2px)}
.overlay.on{opacity:1;visibility:visible}
.modal{position:fixed;inset:0;z-index:101;display:grid;place-items:center;padding:20px;pointer-events:none}
.modal.on{pointer-events:auto}
.modal-content{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 25px 50px -12px rgba(0,0,0,.5);max-width:720px;width:100%;max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;opacity:0;transform:scale(.9);transition:.3s;pointer-events:auto}
.modal.on .modal-content{opacity:1;transform:scale(1)}
.modal-h{padding:26px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex:0 0 auto}
.modal-h h3{font-family:'Fraunces';font-size:20px;font-weight:600}
.modal-h .close{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:20px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;transition:.15s}
.modal-h .close:hover{background:var(--panel);color:var(--ink)}
.modal-body{padding:26px 32px;overflow-y:auto;flex:1}
.modal-body h4{font-family:'Fraunces';font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);margin-bottom:12px;margin-top:18px}
.modal-body h4:first-child{margin-top:0}
.movs-list{display:flex;flex-direction:column;gap:8px}
.mov{display:grid;grid-template-columns:50px 1fr 80px;gap:12px;align-items:center;padding:10px;background:var(--panel);border-radius:8px;font-size:13px}
.mov-t{font-weight:700;color:var(--gold)}
.mov-a{color:var(--ink);font-family:'JetBrains Mono';font-weight:600}
.mov-c{color:var(--ink2);font-size:12px}
.mov .neg{color:var(--red)} .mov .pos{color:var(--green)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:18px;background:var(--panel);border-radius:10px;margin-top:18px}
.sum-item{text-align:center}
.sum-item b{display:block;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.sum-item span{display:block;font-size:16px;font-weight:700;font-family:'JetBrains Mono'}
.sum-item .dif{color:var(--red);font-size:13px;display:block;margin-top:3px}

/* day editor */
.ed-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110;opacity:0;visibility:hidden;transition:.2s;pointer-events:none;backdrop-filter:blur(2px)}
.ed-overlay.on{opacity:1;visibility:visible;pointer-events:auto}
.ed-modal{position:fixed;inset:0;z-index:111;display:grid;place-items:center;padding:20px}
.ed-modal-content{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 25px 50px -12px rgba(0,0,0,.5);max-width:760px;width:100%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;opacity:0;transform:scale(.9);transition:.3s}
.ed-overlay.on .ed-modal-content{opacity:1;transform:scale(1)}
.ed-h{padding:26px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex:0 0 auto}
.ed-h h3{font-family:'Fraunces';font-size:20px;font-weight:600}
.ed-h .close{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:20px;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;transition:.15s}
.ed-h .close:hover{background:var(--panel);color:var(--ink)}
.ed-body{padding:26px 32px;overflow-y:auto;flex:1}
.ed-foot{padding:20px 32px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end;flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.field input,.field select{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:8px;font-family:inherit;font-size:14px;transition:.15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,166,74,.2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mvrow{display:grid;grid-template-columns:60px 90px 1fr 140px 100px 40px;gap:8px;align-items:center;padding:10px;background:var(--panel);border-radius:8px;margin-bottom:8px}
.mvrow .tgl{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px}
.mvrow .tgl button{background:none;border:none;color:var(--ink2);cursor:pointer;padding:4px 6px;border-radius:4px;transition:.15s;font-weight:600}
.mvrow .tgl button.on{background:var(--gold);color:#1a1206}
.mvrow input,.mvrow select{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;font-family:inherit;font-size:12px}
.mvrow input:focus,.mvrow select:focus{outline:none;border-color:var(--gold)}
.mvrow .rmrow{background:none;border:none;color:var(--ink2);cursor:pointer;padding:4px;border-radius:4px;transition:.15s}
.mvrow .rmrow:hover{background:var(--red-bg);color:var(--red)}
.usdhint{font-size:11px;color:var(--ink3);margin:0 0 8px 60px}
.errline{color:var(--red);font-size:12px;font-weight:600}

/* utils */
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:-248px;top:0;height:100vh;border-right:1px solid var(--line);transition:.3s;width:248px}
  .side.open{left:0}
  .main{position:relative;z-index:10}
  .grid2{grid-template-columns:1fr}
  .months{grid-template-columns:1fr}
  .mvrow{grid-template-columns:1fr;gap:6px}
  .usdhint{margin-left:0;margin-bottom:6px}
}
@media(max-width:640px){
  .topbar{padding:12px 18px;gap:12px;flex-direction:column;align-items:flex-start}
  .topbar h2{width:100%}
  .ticker{width:100%;justify-content:space-between}
  .wrap{padding:20px 18px 70px}
  .kpi{padding:14px 16px}
  .kpi .num{font-size:20px}
  .panel{padding:16px 18px}
  .modal-h{padding:18px 20px}
  .modal-body{padding:18px 20px}
  .ed-h{padding:18px 20px}
  .ed-body{padding:18px 20px}
  .ed-foot{padding:16px 20px}
  .month-card-h{padding:12px 16px}
  .day-item{padding:10px 12px;gap:10px}
}
</style>
</head>
<body>

<div class="app">
  <div class="side">
    <div class="brand">
      <div class="mark">💰</div>
      <div>
        <h1>Caja</h1>
        <span>v1.0</span>
      </div>
    </div>

    <nav>
      <div class="nav-label">Vistas</div>
      <button class="nav-btn on" onclick="switchView('timeline')">
        <span class="ic">📅</span> Línea de tiempo
      </button>
      <button class="nav-btn" onclick="switchView('months')">
        <span class="ic">📊</span> Por mes
      </button>
    </nav>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <button class="nav-btn" id="backupBtn">
        <span class="ic">💾</span> Respaldo
      </button>
      <input type="file" id="importFile" style="display:none" accept=".json">
    </div>

    <div class="side-foot">
      Control de caja diario<br>
      Datos guardados localmente
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2>Movimientos de caja</h2>
      <div class="ticker">
        <div class="tk">
          <b>Ingresos 30d</b>
          <span class="v g" id="tk_in">$ 0</span>
        </div>
        <div class="tk">
          <b>Egresos 30d</b>
          <span class="v r" id="tk_out">$ 0</span>
        </div>
        <div class="tk">
          <b>Neto 30d</b>
          <span class="v" id="tk_net">$ 0</span>
        </div>
        <div class="tk">
          <b>Saldo final</b>
          <span class="v go" id="tk_sf">$ 0</span>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="view on" id="timeline-view">
        <div class="toolbar">
          <div class="search">
            <input type="text" id="searchInput" placeholder="Buscar por concepto, referencia, fecha…">
          </div>
          <button class="btn btn-primary" id="newDayBtn">+ Nuevo día</button>
        </div>
        <svg class="chart-svg" id="chart" style="margin-bottom:30px;height:320px"></svg>

        <div style="margin-bottom:24px">
          <h3 style="font-family:'Fraunces';font-size:18px;margin-bottom:16px">Registro diario</h3>
          <div id="daysList"></div>
        </div>
      </div>

      <div class="view" id="months-view">
        <div style="margin-bottom:20px">
          <button class="btn" onclick="openAllMonths()" style="margin-right:12px">Expandir todos</button>
          <button class="btn" onclick="closeAllMonths()">Colapsar todos</button>
        </div>
        <div class="months" id="monthsList"></div>
      </div>
    </div>
  </div>
</div>

<!-- day modal -->
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-h">
      <div>
        <h3 id="modalDate"></h3>
        <p class="sub" id="modalSub"></p>
      </div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <h4>Movimientos</h4>
      <div class="movs-list" id="modalMovs"></div>
      <div class="summary" id="modalSummary"></div>
      <div style="display:flex;gap:12px;margin-top:20px">
        <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
        <button class="btn btn-primary" onclick="editCurrentDay()" style="margin-left:auto">Editar</button>
      </div>
    </div>
  </div>
</div>

<!-- day editor -->
<div class="ed-overlay" id="edOverlay"></div>
<div class="ed-modal" id="edModal">
  <div class="ed-modal-content">
    <div class="ed-h">
      <h3 id="edTitle">Nuevo día</h3>
      <button class="close" onclick="closeEditor()">✕</button>
    </div>
    <div class="ed-body" id="edBody"></div>
    <div class="ed-foot" id="edFoot"></div>
  </div>
</div>

<script>
/* ============ data ============ */
let days=[],userDays=[],openMonths=new Set(),currentModalDay=null,editIso=null,edState={iso:new Date().toISOString().slice(0,10),si:0,tc:1,movs:[{type:'in',cur:'ARS',cpt:'',ref:'',amt:''}]};
const storageOK=typeof(Storage)!=='undefined';

// Load user data
function loadUser(){try{const s=localStorage.getItem('caja_user');if(s)userDays=JSON.parse(s)}catch{}}
function saveUser(){if(storageOK)localStorage.setItem('caja_user',JSON.stringify(userDays))}

// Merge and sort
function mergeData(){days=[...userDays].sort((a,b)=>new Date(b.iso)-new Date(a.iso))}

// Date utils
function wdOf(iso){const d=new Date(iso+'T00:00:00Z'),wds=['Do','Lu','Ma','Mi','Ju','Vi','Sa'];return wds[d.getUTCDay()]}
function shortDate(iso){const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`}
function formatDate(iso){const d=new Date(iso+'T00:00:00Z'),opts={weekday:'long',day:'numeric',month:'long',year:'numeric'};return d.toLocaleDateString('es-AR',opts)}
function esc(s){return(s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Currency
function peso(n){return'$ '+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function pesoS(n){return(n>=0?'$ ':'−$ ')+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function usd(n){return(n>=0?'USD ':'−USD ')+Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}

/* ============ chart ============ */
function renderChart(){
  const last30=days.filter(d=>new Date(d.iso)>new Date(Date.now()-30*86400000));
  let cumIngg=0,cumEgg=0;
  const pts=last30.map((d,i)=>{cumIngg+=d.ing;cumEgg+=d.egr;const y=d.ing+d.egr;return{iso:d.iso,x:i,y,ing:cumIngg,egr:cumEgg}}).reverse();
  
  const svg=document.getElementById('chart');const w=svg.clientWidth,h=320;
  const x0=60,y0=40,pw=w-x0-30,ph=h-y0-50;
  const maxY=Math.max(...pts.map(p=>Math.max(p.ing,-p.egr)),1)*1.15;
  
  let html=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  
  // Grid
  for(let i=0;i<=5;i++){
    const yv=maxY*i/5,py=y0+ph-ph*i/5;
    html+=`<line class="gl" x1="${x0}" y1="${py}" x2="${w-30}" y2="${py}"/>`;
    html+=`<text x="${x0-8}" y="${py+4}" text-anchor="end" font-size="11">${Math.round(yv)}</text>`;
  }
  
  // Bars
  pts.forEach((p,i)=>{
    const px=x0+pw*i/(pts.length-1||1),bw=Math.max(pw/(pts.length*2.5),3);
    const ingH=ph*p.ing/maxY,eggH=ph*(-p.egr)/maxY;
    if(p.ing>0)html+=`<rect x="${px-bw}" y="${y0+ph-ingH}" width="${bw}" height="${ingH}" fill="var(--green)" opacity=".7"/>`;
    if(p.egr<0)html+=`<rect x="${px}" y="${y0+ph-eggH}" width="${bw}" height="${eggH}" fill="var(--red)" opacity=".7"/>`;
  });
  
  html+=`</svg>`;
  svg.innerHTML=html;
}

/* ============ timeline ============ */
function renderTimeline(){
  let html='';
  const filt=document.getElementById('searchInput')?.value.toLowerCase()||'';
  const fdays=days.filter(d=>{
    if(!d.movs)return!filt;
    return d.iso.includes(filt)||d.movs.some(m=>(m.cpt+' '+m.ref).toLowerCase().includes(filt));
  });
  
  fdays.forEach(d=>{
    const cls=d.empty?'empty':'';
    html+=`<div class="kpi ${cls}" onclick="openDay('${d.iso}')" style="cursor:pointer">
      <div class="lab">${formatDate(d.iso).toUpperCase()}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px">
        <div>
          <div style="font-size:11px;color:var(--ink3);margin-bottom:3px">SALDO FINAL</div>
          <div class="num" style="color:var(--gold2)">${peso(d.sf)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--ink3)">Movimientos: ${d.nmov||0}</div>
        </div>
      </div>
    </div>`;
  });
  
  document.getElementById('daysList').innerHTML=html||'<p style="color:var(--ink3)">Sin registros</p>';
}

/* ============ months ============ */
function renderMonths(){
  const grouped={};
  days.forEach(d=>{
    const m=d.iso.slice(0,7);
    if(!grouped[m])grouped[m]={yr:d.y,mo:d.m,days:[]};
    grouped[m].days.push(d);
  });
  
  let html='';
  Object.keys(grouped).sort().reverse().forEach(m=>{
    const g=grouped[m],ym=g.yr+'-'+String(g.mo).padStart(2,'0'),open=openMonths.has(ym);
    const in_total=g.days.reduce((s,d)=>s+d.ing,0),out_total=g.days.reduce((s,d)=>s+d.egr,0);
    
    html+=`<div class="month-card">
      <div class="month-card-h">
        <h4>${new Date(g.yr,g.mo-1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</h4>
        <button onclick="toggleMonth('${ym}')">${open?'−':'+'}</button>
      </div>`;
    
    if(open){
      html+=`<div class="month-days">`;
      g.days.forEach(d=>{
        html+=`<div class="day-item ${d.empty?'empty':''} ${d.dif!=null?'has-dif':''}" onclick="openDay('${d.iso}')">
          <div class="day-date">
            <div class="day-date-num">${String(d.d).padStart(2,'0')}</div>
            <div class="day-date-wd">${d.wd}</div>
          </div>
          <div class="day-fig">
            <div class="day-fig-item">
              <b>Ingresos</b>
              <span class="pos">${peso(d.ing)}</span>
            </div>
            <div class="day-fig-item">
              <b>Egresos</b>
              <span class="neg">${pesoS(d.egr)}</span>
            </div>
            <div class="day-fig-item">
              <b>Saldo</b>
              <span>${peso(d.sf)}</span>
            </div>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }
    
    html+=`</div>`;
  });
  
  document.getElementById('monthsList').innerHTML=html;
}

function toggleMonth(ym){
  if(openMonths.has(ym))openMonths.delete(ym);
  else openMonths.add(ym);
  renderMonths();
}

function openAllMonths(){
  Object.keys(days.reduce((o,d)=>{o[d.iso.slice(0,7)]=1;return o},{})).forEach(m=>openMonths.add(m));
  renderMonths();
}

function closeAllMonths(){openMonths.clear();renderMonths()}

/* ============ views ============ */
function switchView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.getElementById(v+'-view').classList.add('on');
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('on'));
  event.target.closest('.nav-btn').classList.add('on');
}

/* ============ modals ============ */
function openDay(iso){
  const d=days.find(x=>x.iso===iso);if(!d)return;
  currentModalDay=iso;
  document.getElementById('modalDate').textContent=formatDate(iso);
  document.getElementById('modalSub').textContent=`${d.wd.toUpperCase()} · Saldo inicial: ${peso(d.si)}`;
  
  let movsHtml='';
  if(d.movs&&d.movs.length){
    d.movs.forEach(m=>{
      const type=m.imp>=0?'in':'out',sym=type==='in'?'＋':'−';
      movsHtml+=`<div class="mov">
        <div class="mov-t">${sym}</div>
        <div><div class="mov-c">${esc(m.cpt)}</div>${m.ref?'<div style="font-size:11px;color:var(--ink3)">'+esc(m.ref)+'</div>':''}</div>
        <div class="mov-a ${type}">${peso(Math.abs(m.imp))}</div>
      </div>`;
    });
  }
  document.getElementById('modalMovs').innerHTML=movsHtml;
  
  let sumHtml=`
    <div class="sum-item"><b>Saldo inicial</b><span>${peso(d.si)}</span></div>
    <div class="sum-item"><b>Ingresos</b><span class="pos">${peso(d.ing)}</span></div>
    <div class="sum-item"><b>Egresos</b><span class="neg">${pesoS(d.egr)}</span></div>
    <div class="sum-item"><b>Saldo final</b><span>${peso(d.sf)}</span></div>`;
  if(d.fis!=null)sumHtml+=`<div class="sum-item"><b>Conteo físico</b><span>${peso(d.fis)}</span>${d.dif!=null?'<div class="dif">Diferencia: '+pesoS(d.dif)+'</div>':''}</div>`;
  if(d.chq!=null)sumHtml+=`<div class="sum-item"><b>Cheques/valores</b><span>${peso(d.chq)}</span></div>`;
  
  document.getElementById('modalSummary').innerHTML=sumHtml;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('modal').classList.add('on');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
  currentModalDay=null;
}

function editCurrentDay(){
  if(currentModalDay)editDay(currentModalDay);
}

document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};

/* ============ editor ============ */
function blankMov(){return{type:'in',cur:'ARS',cpt:'',ref:'',amt:''}}

function openEditor(existing){
  editIso=existing?.iso;
  if(existing){
    edState={iso:existing.iso,si:existing.si,tc:existing.tc,movs:existing.movs.map(m=>({type:m.imp>=0?'in':'out',cur:m.usd!=null?'USD':'ARS',cpt:m.cpt,ref:m.ref,amt:String(Math.abs(m.imp))}))};
    document.getElementById('edTitle').textContent='Editar día';
  }else{
    edState={iso:new Date().toISOString().slice(0,10),si:0,tc:1,movs:[blankMov()]};
    document.getElementById('edTitle').textContent='Nuevo día';
  }
  
  const wdv=wdOf(edState.iso);
  document.getElementById('edBody').innerHTML=`
    <div class="fgrid" style="margin-bottom:20px">
      <div class="field"><label>Fecha</label><input type="date" id="f_date" value="${edState.iso}"></div>
      <div class="field"><label>Día</label><input type="text" id="f_wd" value="${wdv}" disabled></div>
    </div>
    <div class="fgrid" style="margin-bottom:20px">
      <div class="field"><label>Saldo inicial ($)</label><input class="amt" id="f_si" value="${edState.si}"></div>
      <div class="field"><label>Tipo de cambio — opcional</label><input class="amt" id="f_tc" value="${edState.tc}"></div>
    </div>
    <h4 style="margin:20px 0 12px;font-family:'Fraunces';font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink3);font-size:12px">Movimientos</h4>
    <div id="mvList"></div>
    <button class="btn" id="addRow" style="margin-bottom:16px">+ Agregar movimiento</button>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;background:var(--panel);border-radius:10px;margin-bottom:16px">
      <div><b style="display:block;font-size:9px;color:var(--ink3);text-transform:uppercase;margin-bottom:4px">Ingresos</b><span id="s_in" style="font-size:16px;font-weight:700;font-family:'JetBrains Mono';color:var(--green)">$ 0</span></div>
      <div><b style="display:block;font-size:9px;color:var(--ink3);text-transform:uppercase;margin-bottom:4px">Egresos</b><span id="s_out" style="font-size:16px;font-weight:700;font-family:'JetBrains Mono';color:var(--red)">$ 0</span></div>
        <div><b style="display:block;font-size:9px;color:var(--ink3);text-transform:uppercase;margin-bottom:4px">Flujo neto</b><span id="s_net">$ 0</span></div>
        <div><b style="display:block;font-size:9px;color:var(--ink3);text-transform:uppercase;margin-bottom:4px">Saldo final</b><span style="color:var(--gold2)" id="s_sf">$ 0</span></div>
      </div>
      <div class="fgrid" style="grid-template-columns:1fr 1fr;margin-top:16px">
        <div class="field"><label>Caja real / conteo físico ($) — opcional</label><input class="amt" id="f_fis" value="${existing?.fis??''}" placeholder="dejar vacío si no aplica"></div>
        <div class="field"><label>Cheques / valores ($) — opcional</label><input class="amt" id="f_chq" value="${existing?.chq??''}" placeholder="0"></div>
      </div>
      <div id="edErr" class="errline" style="margin-top:10px"></div>
    </div>
    <div class="ed-foot">
      ${existing?`<button class="btn btn-del del" onclick="deleteDay('${existing.iso}')">🗑 Eliminar día</button>`:'<div class="del"></div>'}
      <button class="btn btn-ghost" onclick="closeEditor()">Cancelar</button>
      <button class="btn btn-primary" id="saveDay">${existing?'Guardar cambios':'Guardar día'}</button>
    </div>`;
  renderMovRows();recalcEditor();
  document.getElementById('f_date').addEventListener('input',e=>{edState.iso=e.target.value;document.getElementById('f_wd').value=wdOf(e.target.value)});
  ['f_si','f_tc'].forEach(id=>document.getElementById(id).addEventListener('input',recalcEditor));
  document.getElementById('addRow').onclick=()=>{edState.movs.push(blankMov());renderMovRows();recalcEditor()};
  document.getElementById('saveDay').onclick=saveDay;
  document.getElementById('edOverlay').classList.add('on');document.body.style.overflow='hidden';
}
function renderMovRows(){
  const list=document.getElementById('mvList');
  list.innerHTML=edState.movs.map((mv,i)=>`
    <div class="mvrow" data-i="${i}">
      <div class="tgl"><button class="in ${mv.type==='in'?'on':''}" data-t="in">＋</button><button class="out ${mv.type==='out'?'on':''}" data-t="out">−</button></div>
      <select class="cur"><option value="ARS" ${mv.cur==='ARS'?'selected':''}>ARS $</option><option value="USD" ${mv.cur==='USD'?'selected':''}>USD</option></select>
      <input class="cpt" placeholder="Ej: Cambio, Salvador, ABL…" value="${esc(mv.cpt)}">
      <input class="ref" placeholder="opcional" value="${esc(mv.ref)}">
      <input class="amt amount" inputmode="decimal" placeholder="0" value="${mv.amt}">
      <button class="rmrow" title="Quitar">✕</button>
    </div>
    <div class="usdhint" data-h="${i}"></div>`).join('');
  list.querySelectorAll('.mvrow').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll('.tgl button').forEach(b=>b.onclick=()=>{edState.movs[i].type=b.dataset.t;row.querySelectorAll('.tgl button').forEach(x=>x.classList.remove('on'));b.classList.add('on');recalcEditor()});
    row.querySelector('.cur').onchange=e=>{edState.movs[i].cur=e.target.value;recalcEditor()};
    row.querySelector('.cpt').oninput=e=>edState.movs[i].cpt=e.target.value;
    row.querySelector('.ref').oninput=e=>edState.movs[i].ref=e.target.value;
    row.querySelector('.amount').oninput=e=>{edState.movs[i].amt=e.target.value;recalcEditor()};
    row.querySelector('.rmrow').onclick=()=>{edState.movs.splice(i,1);if(!edState.movs.length)edState.movs.push(blankMov());renderMovRows();recalcEditor()};
  });
}
function num(v){if(v===''||v==null)return null;const n=parseFloat((''+v).replace(/[^\d.\-]/g,''));return isNaN(n)?null:n}
function computeEditor(){
  const si=num(document.getElementById('f_si').value)||0;
  const tc=num(document.getElementById('f_tc').value)||0;
  let ing=0,egr=0;const movs=[];
  edState.movs.forEach(mv=>{
    const a=num(mv.amt);if(a==null||a===0)return;
    const sign=mv.type==='out'?-1:1;let impARS,usdv;
    if(mv.cur==='USD'){usdv=sign*a;impARS=tc?usdv*tc:0;}
    else{impARS=sign*a;usdv=tc?impARS/tc:null;}
    impARS=Math.round(impARS*100)/100;
    if(impARS>=0)ing+=impARS;else egr+=impARS;
    movs.push({imp:impARS,cpt:(mv.cpt||'').trim(),ref:(mv.ref||'').trim(),usd:usdv!=null?Math.round(usdv*100)/100:null});
  });
  const sf=Math.round((si+ing+egr)*100)/100;
  return {si,tc,ing:Math.round(ing*100)/100,egr:Math.round(egr*100)/100,sf,movs};
}
function recalcEditor(){
  const c=computeEditor(),tc=c.tc;
  document.getElementById('s_in').textContent=peso(c.ing);
  document.getElementById('s_out').textContent=pesoS(c.egr);
  const net=c.ing+c.egr,ne=document.getElementById('s_net');ne.textContent=pesoS(net);ne.className=net>=0?'pos':'neg';
  document.getElementById('s_sf').textContent=peso(c.sf);
  edState.movs.forEach((mv,i)=>{const h=document.querySelector(`.usdhint[data-h="${i}"]`);if(!h)return;const a=num(mv.amt);if(a==null||a===0){h.textContent='';return}
    if(mv.cur==='USD')h.innerHTML=`≈ ${peso((mv.type==='out'?-1:1)*a*tc)} en pesos`;
    else h.innerHTML=tc?`≈ ${usd((mv.type==='out'?-1:1)*a/tc)}`:'';});
}
function saveDay(){
  const c=computeEditor(),iso=document.getElementById('f_date').value,err=document.getElementById('edErr');
  if(!iso){err.textContent='Elegí una fecha.';return}
  const clash=days.find(d=>d.iso===iso&&!d.empty&&!(editIso&&d.iso===editIso));
  if(clash){err.textContent='Ya existe un día registrado con esa fecha ('+clash.date+').';return}
  const fis=num(document.getElementById('f_fis').value),chq=num(document.getElementById('f_chq').value);
  const[y,mo,dd]=iso.split('-').map(Number);
  const dif=fis!=null?Math.round((c.sf-fis)*100)/100:null;
  const rec={src:'user',sheet:'USER-'+iso,y,m:mo,d:dd,date:`${String(dd).padStart(2,'0')}/${String(mo).padStart(2,'0')}/${y}`,iso,wd:wdOf(iso),
    si:c.si,sf:c.sf,ing:c.ing,egr:c.egr,nmov:c.movs.length,usd:c.tc?Math.round(c.sf):null,tc:c.tc,dif,fis,chq,empty:false,caja:[],
    movs:c.movs.map(m=>({imp:m.imp,cpt:m.cpt,ref:m.ref,usd:m.usd}))};
  if(editIso){const idx=userDays.findIndex(d=>d.iso===editIso);if(idx>=0)userDays[idx]=rec;else userDays.push(rec)}
  else userDays.push(rec);
  saveUser();openMonths.add(y+'-'+String(mo).padStart(2,'0'));
  const wasEdit=!!editIso;closeEditor();renderAll();
  toast(wasEdit?'Día actualizado':'Día agregado correctamente');
  setTimeout(()=>openDay(iso),120);
}
function deleteDay(iso){
  if(!confirm('¿Eliminar este día y todos sus movimientos? Esta acción no se puede deshacer.'))return;
  userDays=userDays.filter(d=>d.iso!==iso);saveUser();closeEditor();closeModal();renderAll();toast('Día eliminado');
}
function editDay(iso){const d=days.find(x=>x.iso===iso);closeModal();if(d)openEditor(d)}
function closeEditor(){document.getElementById('edOverlay').classList.remove('on');if(!document.getElementById('overlay').classList.contains('on'))document.body.style.overflow=''}
document.getElementById('edOverlay').onclick=e=>{if(e.target.id==='edOverlay')closeEditor()};
document.getElementById('newDayBtn').onclick=()=>openEditor(null);

/* ============ toast ============ */
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--gold),#a8771f);color:#1a1206;font-weight:700;padding:13px 22px;border-radius:12px;z-index:300;box-shadow:var(--shadow);opacity:0;transition:.3s;font-size:14px;max-width:88vw;text-align:center';document.body.appendChild(t)}t.textContent='✓ '+msg;requestAnimationFrame(()=>{t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)'});clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(-50%) translateY(20px)'},3000)}

/* ============ backup ============ */
function dl(name,data,type){const a=document.createElement('a');a.href='data:'+type+';charset=utf-8,'+encodeURIComponent(data);a.download=name;a.click()}
document.getElementById('backupBtn').onclick=()=>{
  const n=userDays.length;
  if(confirm(`Respaldo de días agregados\n\nTenés ${n} día(s) cargado(s) manualmente.\n\nAceptar = Exportar respaldo (.json)\nCancelar = Importar un respaldo`)){
    if(!n){alert('Todavía no agregaste días manualmente.');return}
    dl('respaldo_caja_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(userDays,null,1),'application/json');
  }else{document.getElementById('importFile').click()}
};
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;
    const map={};userDays.forEach(d=>map[d.iso]=d);arr.forEach(d=>{if(d&&d.iso&&d.src==='user')map[d.iso]=d});
    userDays=Object.values(map);saveUser();renderAll();toast(arr.length+' día(s) importado(s)');
  }catch(err){alert('El archivo no es un respaldo válido.')}e.target.value=''};
  r.readAsText(f);
};

// Search
document.getElementById('searchInput').addEventListener('input',renderTimeline);

/* ============ ticker ============ */
function renderTicker(){
  const now=new Date(),start=new Date(now);start.setDate(now.getDate()-30);
  const recent=days.filter(d=>new Date(d.iso)>=start);
  const in_total=recent.reduce((s,d)=>s+d.ing,0);
  const out_total=recent.reduce((s,d)=>s+d.egr,0);
  const last=days[0];
  document.getElementById('tk_in').textContent=peso(in_total);
  document.getElementById('tk_out').textContent=pesoS(out_total);
  document.getElementById('tk_net').textContent=pesoS(in_total+out_total);
  document.getElementById('tk_sf').textContent=peso(last?.sf??0);
}

/* ============ render all ============ */
function renderAll(){
  loadUser();mergeData();renderChart();renderTimeline();renderMonths();renderTicker();
}

/* ============ init ============ */
renderAll();
if(!storageOK)setTimeout(()=>toast('Aviso: este entorno no guarda cambios al recargar. Descargá el archivo y abrilo localmente para conservarlos.'),400);
</script>
